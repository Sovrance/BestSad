name: CI

on:
  # Trunk only. A topic branch is covered by the `pull_request` trigger, so matching every
  # branch here ran the whole suite twice on each PR push — two workflow runs, thirteen
  # duplicate check runs, for one commit.
  push:
    branches: [v1]
  pull_request:

concurrency:
  # Supersede an in-flight run when a branch is pushed again: only the newest commit's result
  # is informative, and a stale run finishing later can report green for code already replaced.
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Run tests
        run: pytest -q -m "not slow"

  integrity:
    name: evaluator integrity (Gate G1)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      # Run separately and unconditionally: a trust-boundary regression must be visible as its
      # own failing check rather than as one line inside a long test log.
      - name: Trust boundary and anti-gaming suite
        run: pytest -q tests/integrity

  kernel-sweep:
    name: K0 differential sweep (Gate G0)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      # The full 10^5-program sweep required by implementation plan M1. Slow, so it runs as its
      # own job rather than inflating every test run.
      - name: Full differential sweep
        run: pytest -q -m slow tests/kernel

  assurance:
    name: assurance protocol (§14 acceptance)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      # Its own job: the ten acceptance criteria in the assurance integration spec are the
      # contract that producers cannot promote themselves and that controls bind promotion.
      # A regression there should be visible as a named failing check.
      - name: Assurance acceptance suite
        run: pytest -q tests/assurance
      - name: CLI smoke
        run: |
          bestsad assure roots
          bestsad --help

  evaluator-image:
    name: evaluator image (spec §27.1 deployment half)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the evaluator image
        run: docker build -f src/bestsad/evaluator/Dockerfile -t bestsad-evaluator:ci .
      # The image's value is in what it does not contain and what it cannot do, so assert both
      # rather than trusting the comments inside the Dockerfile. A Dockerfile that is only read,
      # never run, is documentation with a filename that implies otherwise.
      - name: Image carries no hidden evaluation assets (spec §27.2)
        run: |
          # Prove the probe works before trusting its negative. Written the obvious way — an
          # `if` around a test for the assets' presence — a container that fails to start, or
          # an image with no shell, reports "nothing found" and the check passes having
          # verified nothing. That is the same defect this branch exists to remove: a control
          # that binds only when it happens to run.
          # Search the whole image rather than two guessed paths — the point is that the assets
          # are nowhere in it, not that they are absent from where I thought to look — and run
          # the search as root so no directory is skipped for permissions.
          #
          # The query carries its own positive control. `canonicalize.py` is known to be in the
          # image, so if the search cannot find the file that is definitely there, its silence
          # about the files that must not be there proves nothing. Without this, any way for the
          # search to fail — the earlier version exited non-zero on permission-denied and took
          # `set -e` with it — reads as a clean image.
          probe="$(docker run --rm --user 0 --entrypoint sh bestsad-evaluator:ci \
                     -c 'find / -xdev \( -name "hidden_evaluator*" -o -name "canonicalize.py" \) -print' \
                   || true)"
          if ! printf '%s\n' "$probe" | grep -q 'canonicalize\.py'; then
            echo "::error::the image probe missed its own positive control; the search did not run"
            exit 1
          fi
          if printf '%s\n' "$probe" | grep -q 'hidden_evaluator'; then
            echo "::error::hidden evaluation assets are present in the evaluator image:"
            printf '%s\n' "$probe" | grep 'hidden_evaluator'
            exit 1
          fi
      - name: Runs unprivileged
        run: |
          uid="$(docker run --rm --entrypoint id bestsad-evaluator:ci -u)"
          test "$uid" = "10001" || { echo "::error::image runs as uid $uid"; exit 1; }
      - name: Starts read-only, with no network and no capabilities
        run: |
          docker run --rm \
            --network none \
            --read-only \
            --tmpfs /scratch:rw,noexec,nosuid,size=64m \
            --cap-drop ALL \
            --security-opt no-new-privileges \
            --pids-limit 128 \
            bestsad-evaluator:ci --help

  verification:
    name: verification (Gate G-V)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,verify]"
      # The symbolic equivalence tier (spec V4, ADR-0019) and the controls around it: the
      # encoder-versus-reference differential test, the counterexample discipline, fail-closed
      # behaviour, external-proof corroboration and non-vacuity. Its own job because the solver
      # is an optional dependency: the `tests` job runs without one and these tests skip there,
      # so a regression in the plane must be visible as a named failing check, not as skips.
      - name: Verification plane
        run: pytest -q tests/verify

  k0-twin-parity:
    name: K0 twin parity (BEST-VERIF-05)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      # The Rust twin of K0 (k0rs/, ADR-0020). build.rs refuses to compile it unless the hash
      # it computes from its own op table equals the Python KERNEL_VERSION_HASH, so a green
      # build is already the first half of the parity claim.
      - name: Build and test the twin
        run: |
          cargo clippy --manifest-path k0rs/Cargo.toml --release --all-targets -- -D warnings
          cargo test --manifest-path k0rs/Cargo.toml --release
      # The other half: both implementations over the same M1 corpus (the full 10^5, seed
      # 20260817, fuel 20_000) must produce the identical Value | Trap(kind) and the identical
      # step count. Agreement is corroborated, not proven; the Python reference is normative.
      - name: Differential parity with the Python reference
        run: pytest -q tests/verify/test_k0_twin.py

  k0-twin-proofs:
    name: K0 twin proofs (Kani, BEST-VERIF-05)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: dtolnay/rust-toolchain@stable
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          cargo install --locked kani-verifier
          cargo kani setup
      # Every #[kani::proof] harness in k0rs/src/proofs.rs must verify within the 60 s
      # per-harness budget the design document sets (harnesses over budget are split, never
      # loosened). The gate parses cargo kani's output into the report shape
      # bestsad.verify.external.from_kani_report ingests and ingests it, so the artefact is
      # known to be consumable as bounded, external FORMAL evidence.
      - name: Kani harnesses within budget
        run: python scripts/kani_gate.py --budget-s 60
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kani-report
          path: k0rs/target/kani_report.json
          if-no-files-found: ignore

  schemas:
    name: schema validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Validate emitted records against schemas/
        run: pytest -q tests/schemas
