[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bestsad"
version = "0.2.0"
description = "Bestsad research instrument: evolved machine-native computational representations under controlled evaluation"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "jsonschema>=4.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.scripts]
bestsad = "bestsad.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: long-running acceptance tests (differential kernel sweep, full EXP runs)",
]
filterwarnings = ["error"]
