[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bestsad"
version = "0.2.0"
description = "Bestsad research instrument: evolved machine-native computational representations under controlled evaluation"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
# Proprietary: this classifier makes PyPI reject an upload outright, so an accidental
# `twine upload` fails rather than publishing unpublished research materials.
classifiers = ["Private :: Do Not Upload"]
dependencies = [
    "jsonschema>=4.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]
# The symbolic equivalence tier (spec V4). Optional on purpose: core dependencies stay
# `jsonschema` only (ADR-0002), and without a solver Tier 2 returns UNKNOWN with reason
# `solver_unavailable` while Gate G-V reports UNAVAILABLE, never OK (ADR-0019).
verify = ["z3-solver>=4.12"]

[project.scripts]
bestsad = "bestsad.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: long-running acceptance tests (differential kernel sweep, full EXP runs)",
]
filterwarnings = ["error"]
